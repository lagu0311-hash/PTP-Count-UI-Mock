<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PTP Count | 密集点の前面切替 UI mock</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f8fb;color:#17344c;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}main{max-width:520px;margin:auto;padding:16px}h1{font-size:22px;margin:12px 0 4px}.note{color:#536c7f;font-size:13px;line-height:1.6}.card{background:white;border:1px solid #bfd0dc;border-radius:16px;padding:14px;margin-top:14px}button{border:1px solid #9db5c7;background:white;color:#153c59;border-radius:11px;padding:13px 12px;font-size:15px;font-weight:700;cursor:pointer;touch-action:manipulation}button.primary{background:#176a9d;color:white;border-color:#176a9d}button:disabled{opacity:.4}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.status{font-size:18px;font-weight:700;margin:8px 0}#board{width:100%;display:block;touch-action:manipulation;background:#e4edf4;border-radius:14px;border:1px solid #b4c6d4}.tag{font-size:12px;color:#42647d}#picked{padding:10px;background:#eef5fb;border-radius:10px;min-height:46px;line-height:1.7}.pill{display:inline-block;margin:3px;padding:5px 8px;border-radius:8px;background:#dceef9;font-weight:600}.legend{font-size:13px;line-height:1.6}.legend b{color:#176a9d}#message{color:#a44512;min-height:22px;font-size:13px} .small{font-size:12px;color:#607587}
</style></head><body><main><h1>PTP Count｜密集点 UI mock</h1><div class="note">表示と操作の試作です。合成点のみ・保存なし・実画像なし・実モデルなし。既存のPTP Countには影響しません。</div>
<div class="card"><div class="status" id="frontLabel">最前面：正解点 G1</div><svg id="board" viewBox="0 0 340 320" aria-label="合成PTPの重なった点"><ellipse cx="170" cy="155" rx="123" ry="132" fill="#f7fbfd" stroke="#a8bbc9" stroke-width="7"/><ellipse cx="170" cy="162" rx="86" ry="94" fill="#dbe6ef"/></svg><div class="controls"><button class="primary" id="next">次の点を前面へ ↻</button><button id="reset">前面順を戻す</button></div><p class="legend">重なっている点が<strong>順番に本当に前へ出ます</strong>。見えた点を画像上でタップすると、判定対象に追加します。</p><div id="message" role="status"></div></div>
<div class="card"><div class="controls"><button id="mode1" class="primary">① 正解</button><button id="mode2">② 重複</button></div><div class="status" id="modeLabel">① 正解：GとAを選ぶと自動確定</div><div class="tag">緑の丸：正解点（G）／橙の四角：AI点（A）</div><div class="status">判定対象</div><div id="picked">まだ選択されていません</div><div class="controls"><button id="undo">最後の選択を戻す</button><button id="commit" disabled>② 重複を確定</button></div><p class="small" id="history">確定した判定：0件</p></div>
<p class="note">前面切替は表示だけを変更し、判定対象を増減させません。点を直接タップした時だけ判定対象に追加します。密集点の切替・①自動確定・②複数選択を試せます。</p></main>
<script>
const ns='http://www.w3.org/2000/svg',board=document.getElementById('board');
const dots=[{id:'G1',kind:'G',x:155,y:157},{id:'A1',kind:'A',x:177,y:157},{id:'A9',kind:'A',x:185,y:176},{id:'A10',kind:'A',x:155,y:132}];
let front=0,mode=1,picked=[],history=[];
function node(tag,attrs){const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);return e}
function render(){
board.querySelectorAll('.dot').forEach(e=>e.remove());
const order=[...dots.filter((_,i)=>i!==front),dots[front]];
order.forEach(d=>{
 const g=node('g',{class:'dot','data-id':d.id,style:'cursor:pointer'});
 const selected=picked.includes(d.id);
 const shape=d.kind==='G'?node('circle',{cx:d.x,cy:d.y,r:30,fill:'#e4f7e9',stroke:selected?'#b52b70':'#199653','stroke-width':selected?8:6}):node('rect',{x:d.x-30,y:d.y-30,width:60,height:60,rx:10,fill:'#fff0db',stroke:selected?'#b52b70':'#e27a19','stroke-width':selected?8:6});
 const label=node('text',{x:d.x,y:d.y+7,'text-anchor':'middle','font-size':19,'font-weight':800,fill:'#5b361d','pointer-events':'none'});label.textContent=d.id;
 g.append(shape,label);g.addEventListener('click',()=>select(d.id));board.append(g);
});
document.getElementById('frontLabel').textContent='最前面：'+(dots[front].kind==='G'?'正解点 ':'AI点 ')+dots[front].id;
document.getElementById('picked').innerHTML=picked.length?picked.map(id=>'<span class="pill">'+id+'</span>').join(''):'まだ選択されていません';
document.getElementById('commit').disabled=mode!==2||!valid();
document.getElementById('history').textContent='確定した判定：'+history.length+'件'+(history.length?'（最新：'+history.at(-1).join(' + ')+'）':'');
}
function valid(){return picked.filter(id=>id.startsWith('G')).length===1&&picked.filter(id=>id.startsWith('A')).length>=(mode===1?1:2)}
function select(id){
const kind=id[0],G=picked.filter(x=>x[0]==='G'),A=picked.filter(x=>x[0]==='A');
if(picked.includes(id)){document.getElementById('message').textContent=id+' は選択済みです';return}
if(kind==='G'&&G.length){document.getElementById('message').textContent='正解点は1点だけ選択できます';return}
if(mode===1&&kind==='A'&&A.length){document.getElementById('message').textContent='①のAI点は1点だけ選択できます';return}
picked.push(id);document.getElementById('message').textContent=id+' を判定対象に追加しました';
if(mode===1&&valid()){history.push([...picked]);picked=[];document.getElementById('message').textContent='① 正解を自動確定しました'}
render();
}
document.getElementById('next').onclick=()=>{front=(front+1)%dots.length;document.getElementById('message').textContent='前面表示のみ変更しました';render()};
document.getElementById('reset').onclick=()=>{front=0;render()};
for(const m of [1,2])document.getElementById('mode'+m).onclick=()=>{mode=m;picked=[];document.getElementById('mode1').classList.toggle('primary',m===1);document.getElementById('mode2').classList.toggle('primary',m===2);document.getElementById('modeLabel').textContent=m===1?'① 正解：GとAを選ぶと自動確定':'② 重複：G1点とA複数点を選び、確定';document.getElementById('message').textContent='';render()};
document.getElementById('undo').onclick=()=>{picked.pop();render()};
document.getElementById('commit').onclick=()=>{if(!valid())return;history.push([...picked]);picked=[];document.getElementById('message').textContent='② 重複を確定しました';render()};
render();
</script></body></html>
